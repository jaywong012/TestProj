server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Try to serve static files directly, otherwise fallback to index.html for SPA routing
        try_files $uri $uri/ /index.html;

        # Disable caching for HTML files
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires 0 always;
    }

    # Optionally, set longer caching for assets that include hashes in their names (if using CRA or similar)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg)$ {
        # These assets can be cached longer because they change when the file content changes
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}